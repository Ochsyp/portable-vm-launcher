# Runs PSScriptAnalyzer and Pester in Windows PowerShell 5.1, Pester in PowerShell 7 on Windows
# and Linux, and the privacy scan over the tracked files, on every push and pull request.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request at a time: a newer pull request run cancels the older one,
# and a newer branch run waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer 1.25.0 and Pester 6.2.0
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          # Install-Module asks before it installs the NuGet provider, so it is installed first.
          if (-not (Get-PackageProvider -ListAvailable | Where-Object { $_.Name -eq 'NuGet' -and $_.Version -ge [version]'2.8.5.201' })) {
            $null = Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }
          # -Force skips the prompt for the untrusted PSGallery; -SkipPublisherCheck lets Pester 6
          # install beside the in-box Pester 3.4, which another publisher signed.
          foreach ($module in @(@{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }, @{ Name = 'Pester'; Version = '6.2.0' })) {
            for ($attempt = 1; ; $attempt++) {
              try {
                Install-Module -Name $module.Name -RequiredVersion $module.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
                break
              } catch {
                if ($attempt -ge 3) { throw }
                Write-Host "Installing $($module.Name) failed, trying again: $($_.Exception.Message)"
                Start-Sleep -Seconds 15
              }
            }
          }
          Get-Module -ListAvailable -Name PSScriptAnalyzer, Pester | Format-Table -AutoSize Name, Version, ModuleBase
      - name: Run tests\run-checks.ps1
        shell: powershell
        run: |
          # Continue, so a line the checks write to stderr does not stop this step; the exit code decides.
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-checks.ps1
          exit $LASTEXITCODE
      - name: Run the privacy scan over the tracked files
        shell: bash
        run: sh .githooks/privacy-scan --tracked

  # The tests in PowerShell 7, the engine Linux uses: on Windows all of them, on Linux all but those
  # tagged WindowsOnly. The analyzer runs in the job above. This job belongs to this repository,
  # not to the repository standard, and stays when the standard is adopted.
  pwsh:
    name: pwsh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester 6.2.0
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          for ($attempt = 1; ; $attempt++) {
            try {
              Install-Module -Name Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Write-Host "Installing Pester failed, trying again: $($_.Exception.Message)"
              Start-Sleep -Seconds 15
            }
          }
      - name: Run tests/run-checks.ps1 without the analyzer
        shell: pwsh
        run: |
          # Continue, so a line the checks write to stderr does not stop this step; the exit code decides.
          $ErrorActionPreference = 'Continue'
          if ($IsWindows) { ./tests/run-checks.ps1 -SkipAnalyzer } else { ./tests/run-checks.ps1 -SkipAnalyzer -ExcludeTag WindowsOnly }
          exit $LASTEXITCODE
