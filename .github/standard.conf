# .github/standard.conf of portable-vm-launcher: data for .github/standard/bin/conf, which alone
# reads it (.github/standard/README.md, Rules).
NAME=portable-vm-launcher
VISIBILITY=public
# lint and test on Windows (Windows PowerShell 5.1, and PowerShell 7 in test); system on Linux.
CI_RUNNER=windows
CI_STAGES=lint test system
PS_MODULES=pester psscriptanalyzer
# zip from the start; VERSION stays X.Y.Z-dev until the first release (phase 10).
RELEASE_KIND=zip
# The launcher handles a disk and two VMs, so the disk and vm packs run too.
PRIVACY_RULES=base disk vm
# d242: a made-up test value, the USB disk name of a fictitious Test_Stick under /dev/disk/by-id,
# the only disk-by-id hit in each of these ten versions of tests/PortableVM.Tests.ps1 on main; it
# names no real disk. Each record names the commit on main that brought that version in. Nothing
# else is accepted.
PRIVACY_HISTORY_ACCEPT=e72eaf93f300400dcffe2b580612a45429822e52 disk-by-id
PRIVACY_HISTORY_ACCEPT=f79732192aa654698744c3224056ed4711ce7d63 disk-by-id
