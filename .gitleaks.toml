# gitleaks settings: the default secret rules, plus the rules of .githooks/privacy-scan for the
# VM, disk and network identifiers that real .vmx, .vbox and VirtualBox.xml files and logs hold,
# private addresses, .lan host names, user home paths and e-mail addresses. Examples and tests
# use only synthetic UUIDs that start with 5ca1ab1e, which the allowlist lets through. Groups are
# non-capturing, so each rule's secret is its whole match.
title = "portable-vm-launcher"

[extend]
useDefault = true

[[rules]]
id = "uuid"
description = "VM, medium or disk UUID"
regex = '''\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b'''
[[rules.allowlists]]
regexes = ['''(?i)^5ca1ab1e''']

[[rules]]
id = "vmware-uuid"
description = "VMware uuid.bios or uuid.location value"
regex = '''\b[0-9A-Fa-f]{2}(?: [0-9A-Fa-f]{2}){7}-[0-9A-Fa-f]{2}(?: [0-9A-Fa-f]{2}){7}\b'''

[[rules]]
id = "mac-address"
description = "Network adapter MAC address"
regex = '''\b[0-9A-Fa-f]{2}(?:[:-][0-9A-Fa-f]{2}){5}\b'''

[[rules]]
id = "virtualbox-mac-address"
description = "MAC address in a VirtualBox MACAddress attribute"
regex = '''(?i)macaddress="?[0-9a-f]{12}'''

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address"
regex = '''\b(?:10(?:\.[0-9]{1,3}){3}|192\.168(?:\.[0-9]{1,3}){2}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2})\b'''

[[rules]]
id = "private-ipv6"
description = "Unique local or link-local IPv6 address"
regex = '''(?i)\b(?:fd[0-9a-f]{2}|fe[89ab][0-9a-f]):[0-9a-f:]*'''

[[rules]]
id = "lan-host"
description = "Host name in the .lan domain"
regex = '''(?i)\b[a-z0-9-]+\.lan\b'''

[[rules]]
id = "home-path"
description = "User home directory path"
regex = '''/home/[A-Za-z0-9._-]+|[A-Za-z]:[\\/]+(?i:users)[\\/]+|/[A-Za-z]/(?i:u)sers/[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+'''

[[rules]]
id = "email"
description = "E-mail address other than a GitHub no-reply one"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[[rules.allowlists]]
regexes = ['''(?i)@(?:users\.noreply\.github\.com|example\.(?:com|org|net))$''', '''(?i)^git@github\.com$''']
